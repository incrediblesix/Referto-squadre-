<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Referto Squadra</title>
<meta name="theme-color" content="#0F1A24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Referto">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: una colonna stretta pensata per il telefono; tabella statistiche con prima colonna fissa, registrazione partita a pulsanti grandi, barra di navigazione in basso. */
:root{
  --bg:#EDEFF2;
  --surface:#FFFFFF;
  --ink:#0F1A24;
  --muted:#59656F;
  --line:#D6DBE1;
  --soft:#E3E7EC;
  --accent:#C93F08;
  --accent-ink:#FFFFFF;
  --accent-soft:#FBE3D8;
  --good:#17724A;
  --bad:#B3261E;
  --board-bg:#0F1A24;
  --board-ink:#FFFFFF;
  --board-accent:#FF8A4F;
  --display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B;--surface:#151E27;--ink:#E9EDF1;--muted:#9AA6B2;--line:#27323E;--soft:#1F2A35;
    --accent:#FF7B45;--accent-ink:#1B0C04;--accent-soft:#3A1E10;--good:#4CC38A;--bad:#FF8A80;
    --board-bg:#1C2833;--board-ink:#F2F5F8;--board-accent:#FF8A4F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B;--surface:#151E27;--ink:#E9EDF1;--muted:#9AA6B2;--line:#27323E;--soft:#1F2A35;
  --accent:#FF7B45;--accent-ink:#1B0C04;--accent-soft:#3A1E10;--good:#4CC38A;--bad:#FF8A80;
  --board-bg:#1C2833;--board-ink:#F2F5F8;--board-accent:#FF8A4F;color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-inline:16px;padding-block:20px 104px}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.teamname{display:block;width:100%;margin:4px 0 14px;padding:0 0 2px;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;font:800 clamp(34px,10vw,52px)/1.02 var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--ink)}
.teamname:not([readonly]):hover{border-bottom-color:var(--line)}
.teamname:focus{outline:none;border-bottom-color:var(--accent)}
.record{display:flex;flex-wrap:wrap;gap:8px 28px;padding-block:12px;border-block:1px solid var(--line);margin-bottom:22px}
.record .fig{display:flex;flex-direction:column;min-width:0}
.record .big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

h2{font:800 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 10px}
.sec{margin-bottom:28px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sechead h2{margin:0}

.leaders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
@media (min-width:600px){.leaders{grid-template-columns:repeat(4,minmax(0,1fr))}}
.leader{border-top:2px solid var(--ink);padding-top:8px;min-width:0}
.leader .val{font:800 42px/1 var(--display);font-variant-numeric:tabular-nums;margin-block:4px 2px}
.leader .who{font-size:14px;overflow-wrap:anywhere}

.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:0 14px;min-height:38px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-size:14px}
thead th{background:var(--soft);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0}
thead th button{background:transparent;border:0;padding:11px 10px;min-height:42px;width:100%;text-align:right;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
thead th[aria-sort] button{color:var(--ink)}
thead th:first-child,tbody td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:var(--surface)}
thead th:first-child{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--soft);border-bottom:0}
tfoot td:first-child{background:var(--soft)}
tr.sel td{background:var(--accent-soft)!important}
.pl{display:flex;align-items:center;gap:9px;background:transparent;border:0;padding:0;text-align:left;min-width:150px}
.num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding-inline:3px;border:2px solid var(--ink);font:800 17px/1 var(--display);flex:none}
.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}

.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);background:transparent;border-radius:6px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:38px;padding:0 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.empty{background:var(--surface);border:1px dashed var(--muted);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.notice{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 12px;margin-bottom:16px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1.5px solid var(--muted);color:var(--muted);border-radius:4px}
.pill{display:inline-grid;place-items:center;min-width:28px;height:28px;padding-inline:6px;border-radius:4px;font:800 16px/1 var(--display);color:#fff}
.pill.w{background:var(--good)}.pill.l{background:var(--bad)}.pill.n{background:var(--muted)}
:root[data-theme="dark"] .pill{color:#0D141B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0D141B}}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{min-height:44px;padding:0 10px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;width:100%;min-width:0}
.field input:focus,.field select:focus{border-color:var(--accent);outline:none}

.games{display:flex;flex-direction:column;gap:10px}
.game{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.game .score{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.game .meta{min-width:0}
.game .opp{font-weight:700;overflow-wrap:anywhere}
.game .when{font-size:13px;color:var(--muted)}
.game .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}

.board{background:var(--board-bg);color:var(--board-ink);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.board .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.board .side{display:flex;flex-direction:column;min-width:0}
.board .side.r{align-items:flex-end}
.board .pts{font:800 clamp(54px,18vw,84px)/.95 var(--display);font-variant-numeric:tabular-nums}
.board .us .pts{color:var(--board-accent)}
.board .lab{color:inherit;opacity:.7}
.board .dash{font:800 40px/1 var(--display);opacity:.5;padding-bottom:10px}
.board .steps{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.board .steps button{min-height:38px;min-width:48px;padding:0 10px;background:transparent;border:1.5px solid color-mix(in srgb,var(--board-ink) 55%,transparent);color:var(--board-ink);border-radius:6px;font-weight:700}

.gamepick{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.gamepick select{flex:1;min-width:0;min-height:44px;padding:0 10px;background:var(--surface);border:1.5px solid var(--ink);border-radius:6px}

.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-bottom:8px;margin-bottom:6px}
@media(max-width:700px){.chips{grid-template-columns:repeat(3,1fr)}}
.chip{min-width:0;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 8px 0 6px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px}
.chip .num{min-width:28px;height:28px;font-size:16px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .num{border-color:var(--bg)}
.chip .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip .tx{min-width:0;flex:1}
.chip .st{flex:none}

.line{font-size:14px;color:var(--muted);margin:4px 0 12px;font-variant-numeric:tabular-nums}
.line b{color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.act{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;font-weight:600}
.act .big{font:800 26px/1 var(--display)}
.act .sub{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.act.make{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act.miss{background:var(--soft);border-color:var(--line)}
.fix .act{border-style:dashed}
.fix .act.make{background:transparent;color:var(--accent);border-color:var(--accent)}
.tools{display:flex;gap:8px;margin-block:4px 18px;flex-wrap:wrap}

.detail .dl{display:flex;flex-direction:column}
.detail .dr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.detail .dr:last-child{border-bottom:0}
.detail .stats{font-variant-numeric:tabular-nums;color:var(--muted)}
.detail .stats b{color:var(--ink)}

.rrow{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rrow input{min-height:44px;padding:0 10px;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;min-width:0}
.rrow .rnum{width:72px;text-align:center;font:800 18px var(--display)}
.rrow .rname{flex:1}
.rrow input:focus{border-color:var(--accent);outline:none}
.gedit{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.gedit .form{margin-bottom:10px}
.boxedit input{width:56px;min-height:40px;padding:0 4px;text-align:center;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;font-variant-numeric:tabular-nums}
.boxedit input:focus{border-color:var(--accent);outline:none}
.boxedit th,.boxedit td{padding:6px}
.boxedit thead th{padding:10px 6px;text-align:center}
.boxedit thead th:first-child{text-align:left}
.boxedit .pname{display:flex;align-items:center;gap:9px;min-width:150px;font-weight:600}

.clock{background:var(--board-bg);color:var(--board-ink);border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock .q{font:800 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.clock .time{font:800 clamp(52px,15vw,76px)/1 var(--display);font-variant-numeric:tabular-nums}
.clock .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock .ctl button{min-height:44px;padding:0 14px;background:transparent;border:1.5px solid color-mix(in srgb,var(--board-ink) 55%,transparent);color:var(--board-ink);border-radius:6px;font-weight:700}
.clock .ctl button.go{background:var(--board-accent);border-color:var(--board-accent);color:#1B0C04}
.clock .ctl button:disabled{opacity:.4;cursor:default}
.clock .hint{flex-basis:100%;font-size:13px;opacity:.85}
.chip[data-on="1"]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.chip .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip .mn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .mn{color:inherit;opacity:.8}
.chip .st{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:2px 5px;border-radius:3px}
.line .mn{font-variant-numeric:tabular-nums}
.brand{display:flex;gap:14px;align-items:flex-start}
.bt{flex:1;min-width:0}
.logo{width:72px;height:72px;object-fit:contain;flex:none;margin-top:2px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.logo-add{width:72px;height:72px;flex:none;margin-top:2px;border:2px dashed var(--muted);background:transparent;color:var(--muted);border-radius:8px;font:700 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.05em}
.logorow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.logorow .logo{margin-top:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;min-height:58px;border:0;background:transparent;font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.authbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-8px 0 18px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<input type="file" id="logoFile" accept="image/*" hidden>
<nav class="tabs" id="tabs" aria-label="Sezioni">
  <button data-tab="squadra">Squadra</button>
  <button data-tab="partite">Partite</button>
  <button data-tab="registra">Registra</button>
</nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
var KEYS=['m1','a1','m2','a2','m3','a3','reb','ast','stl','blk','tov','pf','sec'];
var app=document.getElementById('app');
var db=null, editable=false;
var S={players:{},games:{},team:{name:'La mia squadra'},tab:'squadra',gameId:null,sel:null,correct:false,
  sort:{k:'pts',d:-1},mode:'avg',detail:null,editRoster:false,confirmDel:null,editGame:null,editBox:false,confirmDelP:null,subMode:false,starMode:false,loaded:false,error:'',dirty:false,showLogin:false,
  undo:[],form:{date:'',opp:'',home:'home'}};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var nf1=new Intl.NumberFormat('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1});
function fmtDate(iso){var p=(iso||'').split('-').map(Number);if(!p[0])return '';return new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'numeric',month:'short'}).format(new Date(p[0],p[1]-1,p[2]));}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seasonLabel(){var d=new Date(),y=d.getFullYear(),s=d.getMonth()>=7?y:y-1;return s+'/'+String(s+1).slice(2);}
function blank(){var o={};KEYS.forEach(function(k){o[k]=0;});return o;}
function n(o,k){return (o&&o[k])||0;}
function pts(o){return n(o,'m1')+2*n(o,'m2')+3*n(o,'m3');}
function played(o){return !!o&&KEYS.some(function(k){return n(o,k)>0;});}

/* clock-start */
function pad2(x){return (x<10?'0':'')+x;}
function fmtClock(s){s=Math.max(0,Math.ceil(s-1e-6));return pad2(Math.floor(s/60))+':'+pad2(s%60);}
function fmtMS(s){s=Math.max(0,Math.floor(s+1e-6));return pad2(Math.floor(s/60))+':'+pad2(s%60);}
function gstate(g){
  var s=(g&&g.stats&&g.stats.__game)||{};
  return {q:s.q||1,qLen:s.qLen||600,el:s.el||0,run:!!s.run,since:s.since||0,on:Object.assign({},s.on||{}),starters:Object.assign({},s.starters||{})};
}
function packG(c){return {q:c.q,qLen:c.qLen,el:Math.round(c.el*100)/100,run:c.run,since:c.since,on:c.on,starters:c.starters||{}};}
function setGame(g,c){var st=Object.assign({},g.stats||{});st.__game=packG(c);g.stats=st;}
function liveElapsed(g,now){var c=gstate(g);return Math.min(c.qLen,c.el+(c.run?Math.max(0,(now-c.since)/1000):0));}
function liveSec(g,pid,now){
  var s=n((g.stats||{})[pid],'sec'),c=gstate(g);
  if(c.run&&c.on[pid])s+=Math.min(Math.max(0,(now-c.since)/1000),Math.max(0,c.qLen-c.el));
  return s;
}
function settle(g,now){
  var c=gstate(g);if(!c.run)return c;
  var dt=Math.min(Math.max(0,(now-c.since)/1000),Math.max(0,c.qLen-c.el));
  var st=Object.assign({},g.stats||{});
  Object.keys(c.on).forEach(function(pid){
    var o=Object.assign(blank(),st[pid]||{});
    o.sec=Math.round((n(o,'sec')+dt)*100)/100;st[pid]=o;
  });
  c.el+=dt;c.since=now;
  if(c.el>=c.qLen-0.001){c.el=c.qLen;c.run=false;}
  g.stats=st;setGame(g,c);return c;
}
/* clock-end */
function flash(msg){
  S.error=msg;render();
  clearTimeout(flash.t);
  flash.t=setTimeout(function(){S.error='';render();},3500);
}
function clkStart(){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=gstate(g);if(c.run||c.el>=c.qLen)return;
  c.run=true;c.since=Date.now();setGame(g,c);touch(S.gameId);render();
}
function clkStop(){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=settle(g,Date.now());c.run=false;setGame(g,c);touch(S.gameId);render();
}
function clkAdj(d){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=settle(g,Date.now());
  c.el=Math.max(0,Math.min(c.qLen,c.el-d));
  setGame(g,c);touch(S.gameId);render();
}
function clkNext(){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=settle(g,Date.now());
  c.q+=1;c.el=0;c.run=false;setGame(g,c);touch(S.gameId);render();
}
function toggleCourt(pid){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=settle(g,Date.now()),on=Object.assign({},c.on);
  if(on[pid]){delete on[pid];}
  else{
    if(Object.keys(on).length>=5){flash('Ci sono già 5 giocatori in campo. Fai uscire qualcuno prima.');return;}
    on[pid]=1;
  }
  c.on=on;setGame(g,c);touch(S.gameId);render();
}
function toggleStarter(pid){
  var g=S.games[S.gameId];if(!g||!editable)return;
  var c=settle(g,Date.now()),st=Object.assign({},c.starters),on=Object.assign({},c.on);
  var fresh=c.q===1&&c.el===0&&!c.run;
  if(st[pid]){delete st[pid];if(fresh)delete on[pid];}
  else{
    if(Object.keys(st).length>=5){flash('Il quintetto iniziale ha già 5 giocatori. Togline uno prima.');return;}
    st[pid]=1;if(fresh)on[pid]=1;
  }
  c.starters=st;c.on=on;setGame(g,c);touch(S.gameId);render();
}
function clockPanel(g){
  var c=gstate(g),rem=c.qLen-liveElapsed(g,Date.now());
  var ql=c.q<=4?'Quarto '+c.q:'Supplementare '+(c.q-4);
  var ended=!c.run&&c.el>=c.qLen;
  var h='<div class="clock"><div><div class="q">'+ql+'</div><div class="time" id="clk">'+fmtClock(rem)+'</div></div>';
  if(editable){
    h+='<div class="ctl">'+(c.run?'<button data-act="clkStop">Ferma</button>':'<button class="go" data-act="clkStart"'+(ended?' disabled':'')+'>Avvia</button>')+
      '<button data-act="clkAdj" data-d="-10" aria-label="Togli 10 secondi">−10 s</button>'+
      '<button data-act="clkAdj" data-d="10" aria-label="Aggiungi 10 secondi">+10 s</button>'+
      '<button data-act="clkNext">Quarto successivo</button></div>';
  }
  if(editable&&Object.keys(c.on).length===0)h+='<div class="hint">Nessun giocatore in campo, quindi i minuti non salgono. Tocca Quintetto per scegliere i 5 titolari, oppure Cambi per far entrare i giocatori.</div>';
  return h+'</div>';
}
setInterval(function(){
  if(S.tab!=='registra')return;
  var g=S.games[S.gameId];if(!g)return;
  var now=Date.now(),c=gstate(g);
  if(c.run&&c.el+(now-c.since)/1000>=c.qLen){settle(g,now);if(editable)touch(S.gameId);render();return;}
  var el=document.getElementById('clk');
  if(el)el.textContent=fmtClock(c.qLen-liveElapsed(g,now));
  var mm=document.querySelectorAll('.mn[data-pid]');
  var totSec=null;
  for(var i=0;i<mm.length;i++){
    var pid=mm[i].dataset.pid,val;
    if(pid==='*'){
      if(totSec===null){totSec=0;Object.keys(g.stats||{}).forEach(function(k){if(k!=='__game')totSec+=liveSec(g,k,now);});}
      val=totSec;
    }else{val=liveSec(g,pid,now);}
    mm[i].textContent=fmtMS(val);
  }
},1000);
S.form.date=todayISO();

function roster(){
  return Object.keys(S.players).map(function(id){var p=S.players[id];return {id:id,name:p.name||'',number:p.number};})
    .sort(function(a,b){var x=a.number==null?99:a.number,y=b.number==null?99:b.number;return x-y||a.id.localeCompare(b.id);});
}
function games(){
  return Object.keys(S.games).map(function(id){var g=Object.assign({},S.games[id]);g.id=id;return g;})
    .sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||b.id.localeCompare(a.id);});
}
function teamScore(g){
  if(g.ourPts!=null&&g.ourPts!=='')return Number(g.ourPts)||0;
  var s=0;Object.keys(g.stats||{}).forEach(function(pid){s+=pts(g.stats[pid]);});return s;
}
function totals(pid){
  var t=blank();t.gp=0;t.gs=0;
  games().forEach(function(g){
    var st=g.stats&&g.stats[pid];
    var starter=!!(g.stats&&g.stats.__game&&g.stats.__game.starters&&g.stats.__game.starters[pid]);
    if(played(st)||starter){t.gp++;if(starter)t.gs++;KEYS.forEach(function(k){t[k]+=n(st,k);});}
  });
  return t;
}
function colVal(t,k,mode){
  if(k==='gp')return t.gp;
  if(k==='gs')return t.gs;
  if(k==='min'){var mi=n(t,'sec')/60;return mode==='avg'?(t.gp?mi/t.gp:null):mi;}
  if(k==='ftp')return t.a1?t.m1/t.a1*100:null;
  if(k==='p2')return t.a2?t.m2/t.a2*100:null;
  if(k==='p3')return t.a3?t.m3/t.a3*100:null;
  var raw=k==='pts'?pts(t):t[k];
  return mode==='avg'?(t.gp?raw/t.gp:null):raw;
}
function showVal(v,k,mode){
  if(v==null)return '–';
  if(k==='ftp'||k==='p2'||k==='p3')return Math.round(v)+'%';
  if(k==='gp'||k==='gs')return String(v);
  if(k==='min')return mode==='avg'?nf1.format(v):String(Math.round(v));
  return mode==='avg'?nf1.format(v):String(v);
}
var COLS=[['gp','PG'],['gs','TIT'],['min','MIN'],['pts','PT'],['reb','RIM'],['ast','AST'],['stl','REC'],['blk','STO'],['tov','PP'],['pf','FA'],['ftp','TL%'],['p2','2P%'],['p3','3P%']];

/* ---------- salvataggio ---------- */
var pending={},timer=null,flushing=false,flushingId=null;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function touch(gid){pending[gid]=true;clearTimeout(timer);timer=setTimeout(flush,500);}
async function flush(){
  if(flushing){timer=setTimeout(flush,300);return;}
  flushing=true;
  try{
    var ids=Object.keys(pending);
    for(var i=0;i<ids.length;i++){
      var gid=ids[i];delete pending[gid];
      var g=S.games[gid];if(!g||!db)continue;
      flushingId=gid;
      try{await db.doc('games/'+gid).update({stats:g.stats||{},theirPts:g.theirPts||0,ourPts:g.ourPts==null?null:g.ourPts,date:g.date||'',opp:g.opp||'',home:g.home!==false});}
      catch(e){
        if(e&&e.code==='unavailable'){await sleep(700);pending[gid]=true;}
        else{fail(e);}
      }
      flushingId=null;
    }
  }finally{flushing=false;flushingId=null;}
  if(Object.keys(pending).length){timer=setTimeout(flush,300);}
}
function fail(e){
  var c=e&&e.code;
  S.error=c==='quota_exceeded'?'Lo spazio di archiviazione è pieno. Elimina qualche partita vecchia.':
    (c==='invalid_argument'?'Non hai il permesso di modificare questi dati.':'Non sono riuscito a salvare. Controlla la connessione e riprova.');
  render();
}

var ACTS={
  m1:{l:'+1',s:'TL',d:[['m1',1],['a1',1]],k:'make',show:function(o){return n(o,'m1')+'/'+n(o,'a1');}},
  m2:{l:'+2',s:'2P',d:[['m2',1],['a2',1]],k:'make',show:function(o){return n(o,'m2')+'/'+n(o,'a2');}},
  m3:{l:'+3',s:'3P',d:[['m3',1],['a3',1]],k:'make',show:function(o){return n(o,'m3')+'/'+n(o,'a3');}},
  x1:{l:'Err. TL',d:[['a1',1]],k:'miss',show:function(o){return n(o,'a1')-n(o,'m1');}},
  x2:{l:'Err. 2P',d:[['a2',1]],k:'miss',show:function(o){return n(o,'a2')-n(o,'m2');}},
  x3:{l:'Err. 3P',d:[['a3',1]],k:'miss',show:function(o){return n(o,'a3')-n(o,'m3');}},
  reb:{l:'Rimbalzo',d:[['reb',1]],show:function(o){return n(o,'reb');}},
  ast:{l:'Assist',d:[['ast',1]],show:function(o){return n(o,'ast');}},
  stl:{l:'Recupero',d:[['stl',1]],show:function(o){return n(o,'stl');}},
  blk:{l:'Stoppata',d:[['blk',1]],show:function(o){return n(o,'blk');}},
  tov:{l:'Palla persa',d:[['tov',1]],show:function(o){return n(o,'tov');}},
  pf:{l:'Fallo',d:[['pf',1]],show:function(o){return n(o,'pf');}}
};
function apply(gid,pid,deltas,isUndo){
  var g=S.games[gid];if(!g)return false;
  var cur=Object.assign(blank(),(g.stats||{})[pid]||{});
  var nx=Object.assign({},cur);
  deltas.forEach(function(x){nx[x[0]]+=x[1];});
  if(KEYS.some(function(k){return nx[k]<0;})||nx.a1<nx.m1||nx.a2<nx.m2||nx.a3<nx.m3)return false;
  var st=Object.assign({},g.stats||{});st[pid]=nx;g.stats=st;
  if(!isUndo){S.undo.push({gid:gid,pid:pid,d:deltas.map(function(x){return [x[0],-x[1]];})});if(S.undo.length>60)S.undo.shift();}
  touch(gid);return true;
}

  var gs=games(),w=0,l=0,pf=0,pa=0,c=0;
  gs.forEach(function(g){var t=g.theirPts||0;if(t>0){var us=teamScore(g);c++;pf+=us;pa+=t;if(us>t)w++;else if(us<t)l++;}});

    '<div class="record">'+

    var best=null;
    rows.forEach(function(r){if(!r.t.gp)return;var v=colVal(r.t,x[0],'avg');if(v>0&&(!best||v>best.v))best={v:v,p:r.p};});

    var x=colVal(a.t,k,mode),y=colVal(b.t,k,mode);

  }).join('');

  var body=sorted.map(function(r){
    return '<tr><td><button class="pl" data-act="detail" data-id="'+r.p.id+'"><span class="num">'+(r.p.number==null?'–':esc(r.p.number))+'</span><span class="nm">'+esc(r.p.name)+'</span></button></td>'+
      COLS.map(function(c){return '<td>'+showVal(colVal(r.t,c[0],mode),c[0],mode)+'</td>';}).join('')+'</tr>';
  }).join('');
  var out='<section class="sec"><div class="leaders">'+leaders+'</div></section>'+
    '<section class="sec"><div class="sechead"><h2>Statistiche</h2><div class="seg" role="group" aria-label="Tipo di valori">'+
    '<button data-act="mode" data-m="avg" aria-pressed="'+(mode==='avg')+'">A partita</button>'+
    '<button data-act="mode" data-m="tot" aria-pressed="'+(mode==='tot')+'">Totali</button></div></div>'+
    '<div class="tablewrap"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<p class="legend">PG partite giocate · TIT da titolare · MIN minuti · PT punti · RIM rimbalzi · AST assist · REC recuperi · STO stoppate · PP palle perse · FA falli · TL tiri liberi · 2P e 3P tiri da due e da tre. Tocca un giocatore per vedere le sue partite.</p></section>';
  if(S.detail&&S.players[S.detail]){out+=detailView(S.detail);}
  if(editable){
    out+='<section class="sec"><div class="sechead"><h2>Squadra</h2><button class="btn small" data-act="toggleRoster" aria-pressed="'+S.editRoster+'">'+(S.editRoster?'Chiudi':'Modifica nomi e numeri')+'</button></div>';
    if(S.editRoster){
      out+='<div class="card">'+ro.map(function(p){
        return '<div class="rrow"><input type="number" inputmode="numeric" min="0" max="99" class="rnum" data-field="pnum" data-id="'+p.id+'" value="'+(p.number==null?'':esc(p.number))+'" aria-label="Numero di maglia"><input type="text" class="rname" data-field="pname" data-id="'+p.id+'" value="'+esc(p.name)+'" maxlength="40" aria-label="Nome del giocatore">'+(S.confirmDelP===p.id?'<button class="btn small danger" data-act="delPYes" data-id="'+p.id+'">Sì, rimuovi</button><button class="btn small" data-act="delPNo">Annulla</button>':'<button class="btn small" data-act="delPAsk" data-id="'+p.id+'">Rimuovi</button>')+'</div>';

function shrink(img){
  var w=img.naturalWidth||img.width||256,h=img.naturalHeight||img.height||256;
  function draw(max,bg){
    var s=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
    var c=document.createElement('canvas');c.width=cw;c.height=ch;
    var x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,cw,ch);}
    x.drawImage(img,0,0,cw,ch);return c;
  }
  var LIM=150000,u=draw(256).toDataURL('image/png');
  if(u.length<=LIM)return u;
  u=draw(256,'#ffffff').toDataURL('image/jpeg',0.85);if(u.length<=LIM)return u;
  u=draw(160,'#ffffff').toDataURL('image/jpeg',0.75);
  return u.length<=LIM?u:'';
}
function handleLogo(file){
  if(!editable||!db)return;
  if(!/^image\//.test(file.type)){S.error='Scegli un file immagine (PNG, JPG o simile).';return render();}
  if(file.size>15*1024*1024){S.error='L’immagine è troppo grande. Scegline una sotto i 15 MB.';return render();}
  var rd=new FileReader();
  rd.onerror=function(){S.error='Non riesco a leggere il file.';render();};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){S.error='Questo file non sembra un’immagine valida.';render();};
    img.onload=function(){
      var url='';
      try{url=shrink(img);}catch(e){url='';}
      if(!url){S.error='L’immagine è troppo pesante anche dopo il ridimensionamento. Prova con un file più semplice.';return render();}
      S.team=Object.assign({},S.team,{logo:url});S.error='';saveTeam();render();
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ---------- collegamento a Supabase ---------- */
function makeDb(sb){
  var listeners=[],inflight=0,epoch=0,timer=null,knownLogo=null,knownV=null;
  function mapErr(e){
    var m=String((e&&e.message)||'').toLowerCase(),c=e&&e.code;
    if(c==='42501'||/row-level security|permission denied|jwt/.test(m)||(e&&(e.status===401||e.status===403)))return {code:'invalid_argument',message:(e&&e.message)||''};
    if(/fetch|network|failed|load failed/.test(m)||(e&&e.status===0))return {code:'unavailable',message:(e&&e.message)||''};
    return {code:'unknown',message:(e&&e.message)||''};
  }
  async function w(p){
    inflight++;epoch++;
    try{var r=await p;if(r&&r.error)throw r.error;return r;}
    catch(e){throw mapErr(e);}
    finally{inflight--;epoch++;}
  }
  function gameRow(g){
    var o={};
    if('date' in g)o.date=g.date||'';
    if('opp' in g)o.opp=g.opp||'';
    if('home' in g)o.home=g.home!==false;
    if('theirPts' in g)o.their_pts=g.theirPts||0;
    if('ourPts' in g)o.our_pts=g.ourPts==null?null:g.ourPts;
    if('stats' in g)o.stats=g.stats||{};
    return o;
  }
  function gameObj(r){return {date:r.date||'',opp:r.opp||'',home:r.home!==false,theirPts:r.their_pts||0,ourPts:r.our_pts==null?null:r.our_pts,stats:r.stats||{}};}
  function playerObj(r){return {name:r.name||'',number:r.number==null?null:r.number};}
  function newId(){try{return crypto.randomUUID();}catch(e){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}}

  function doc(path){
    var parts=path.split('/'),col=parts[0],id=parts[1],table=col==='meta'?'team':col;
    return {
      id:id,
      set:async function(d){
        if(col==='meta'){
          var row={id:1,name:d.name||'La mia squadra',season:d.season||''};
          var logo=d.logo||'',newV=knownV;
          if(knownLogo!==null&&logo!==knownLogo){row.logo=logo;newV=Date.now();row.logo_v=newV;}
          await w(sb.from('team').upsert(row));
          if(row.logo_v!==undefined){knownLogo=logo;knownV=newV;}
          return;
        }
        if(col==='players')return w(sb.from('players').upsert({id:id,name:d.name||'',number:d.number==null?null:d.number}));
        var g=gameRow(d);g.id=id;return w(sb.from('games').upsert(g));
      },
      update:function(d){
        if(col==='games')return w(sb.from('games').update(gameRow(d)).eq('id',id));
        if(col==='players')return w(sb.from('players').update({name:d.name,number:d.number}).eq('id',id));
        return this.set(d);
      },
      delete:function(){return w(sb.from(table).delete().eq('id',id));},
      onSnapshot:function(next,err){addListener({kind:'doc',col:col,next:next,err:err,ok:false});return function(){};}
    };
  }
  function collection(name){
    return {
      add:async function(d){
        var id=newId();
        if(name==='games'){var g=gameRow(d);g.id=id;await w(sb.from('games').insert(g));}
        else{await w(sb.from(name).insert(Object.assign({id:id},d)));}
        return {id:id};
      },
      doc:function(id){return doc(name+'/'+id);},
      onSnapshot:function(next,err){addListener({kind:'col',col:name,next:next,err:err,ok:false});return function(){};}
    };
  }
  async function fetchOne(l){
    var e0=epoch;
    try{
      var snap;
      if(l.kind==='doc'){
        var r=await sb.from('team').select('name,season,logo_v').eq('id',1).maybeSingle();
        if(r.error)throw r.error;
        var row=r.data;
        var logo=knownLogo||'';
        var fetchedV=knownV,fetchedLogo=knownLogo;
        if(row&&(knownLogo===null||row.logo_v!==knownV)){
          var r2=await sb.from('team').select('logo').eq('id',1).maybeSingle();
          if(r2.error)throw r2.error;
          fetchedLogo=(r2.data&&r2.data.logo)||'';fetchedV=row.logo_v;logo=fetchedLogo;
        }
        if(epoch!==e0||inflight>0){if(!l.ok)setTimeout(function(){fetchOne(l);},800);return;}
        knownLogo=fetchedLogo;knownV=fetchedV;
        snap={exists:!!row,data:function(){return row?{name:row.name,season:row.season,logo:logo}:undefined;}};
      }else if(l.col==='players'){
        var rp=await sb.from('players').select('id,name,number');
        if(rp.error)throw rp.error;
        if(epoch!==e0||inflight>0){if(!l.ok)setTimeout(function(){fetchOne(l);},800);return;}
        snap={docs:rp.data.map(function(x){return {id:x.id,data:function(){return playerObj(x);}};})};
      }else{
        var rg=await sb.from('games').select('id,date,opp,home,their_pts,our_pts,stats');
        if(rg.error)throw rg.error;
        if(epoch!==e0||inflight>0){if(!l.ok)setTimeout(function(){fetchOne(l);},800);return;}
        snap={docs:rg.data.map(function(x){return {id:x.id,data:function(){return gameObj(x);}};})};
      }
      l.ok=true;l.next(snap);
    }catch(e){
      if(!l.ok&&l.err)l.err(mapErr(e));
    }
  }
  function addListener(l){listeners.push(l);fetchOne(l);}
  function refresh(){if(inflight>0)return Promise.resolve();return Promise.all(listeners.map(fetchOne));}
  function start(){
    if(timer)return;
    timer=setInterval(function(){if(!document.hidden)refresh();},30000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh();});
  }
  return {doc:doc,collection:collection,refresh:refresh,start:start};
}
/* fine makeDb */

/* ---------- avvio ---------- */
render();
(async function(){
  var cfg=window.APP_CONFIG||{};
  if(!cfg.url||!cfg.key||/INSERISCI/.test(String(cfg.url)+String(cfg.key))||!window.supabase){
    S.loaded=true;
    S.error=window.supabase?'Manca la configurazione. Apri il file config.js e inserisci indirizzo e chiave del tuo progetto Supabase (vedi la guida).':'Non riesco a caricare la libreria del database. Controlla la connessione a internet.';
    render();return;
  }
  var sb=window.supabase.createClient(cfg.url,cfg.key);
  window.__sb=sb;
  db=makeDb(sb);
  try{var r=await sb.auth.getSession();editable=!!(r&&r.data&&r.data.session);}catch(e){editable=false;}
  sb.auth.onAuthStateChange(function(ev,session){
    var was=editable;editable=!!session;
    if(was!==editable){S.showLogin=false;S.error='';render();setTimeout(function(){db.refresh();},0);}
  });
  function onErr(e){
    S.loaded=true;
    S.error=(e&&e.code==='unavailable')?'Non riesco a collegarmi al database. Controlla la connessione.':'Non riesco a leggere i dati. Controlla di aver eseguito lo script schema.sql e di aver inserito indirizzo e chiave giusti in config.js.';
    render();
  }
  db.doc('meta/team').onSnapshot(function(s){if(s.exists){S.team=Object.assign({},s.data());}render();},onErr);
  db.collection('players').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=Object.assign({},d.data());});
    S.players=m;S.loaded=true;render();
  },onErr);
  db.collection('games').onSnapshot(function(s){
    var m={};
    s.docs.forEach(function(d){
      m[d.id]=((pending[d.id]||flushingId===d.id)&&S.games[d.id])?S.games[d.id]:Object.assign({},d.data());
    });
    S.games=m;render();
  },onErr);
  db.start();
})();
})();
